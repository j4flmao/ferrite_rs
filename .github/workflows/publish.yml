name: Publish

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Validate publishability (dry run)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Dry-run publish of workspace crates
        uses: katyo/publish-crates@v2
        with:
          dry-run: true
          args: --locked
          ignore-unpublished-changes: true

  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Verify crates.io token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

      # Publishes only the `crates/` packages in dependency order.
      # Examples are marked `publish = false` and are never uploaded.
      - name: Publish workspace crates
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --locked
          ignore-unpublished-changes: true
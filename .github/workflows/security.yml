name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Audit Rust dependencies for vulnerabilities
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa, pulled in by sqlx-mysql): upstream ships no
          # patched release (patched = []), so it cannot be fixed in this repo.
          # Kept aligned with Dependabot security alerts instead of failing CI.
          ignore: RUSTSEC-2023-0071

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
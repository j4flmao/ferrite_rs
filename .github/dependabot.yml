version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # 0 disables version-update pull requests; bumps are handled manually.
    # Security updates (grouped below) are unaffected.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
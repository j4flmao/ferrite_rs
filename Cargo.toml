[workspace]
members = [
    "crates/ferrite-framework",
    "crates/fr-core",
    "crates/ferrite-macros",
    "crates/ferrite-http",
    "crates/ferrite-config",
    "crates/ferrite-validation",
    "crates/ferrite-orm",
    "crates/ferrite-orm-sea",
    "crates/ferrite-orm-diesel",
    "crates/ferrite-orm-sqlx",
    "crates/ferrite-health",
    "crates/ferrite-auth-jwt",
    "crates/ferrite-auth-oauth",
    "crates/ferrite-swagger",
    "crates/ferrite-cache-redis",
    "crates/ferrite-throttler",
    "crates/ferrite-testing",
    "crates/ferrite-ws",
    "crates/ferrite-queue",
    "crates/ferrite-cron",
    "crates/ferrite-grpc",
    "crates/ferrite-nats",
    "crates/ferrite-kafka",
    "crates/ferrite-i18n",
    "crates/ferrite-cqrs",
    "crates/fr-cli",
    "examples/monolith/mono-sqlx-ecom",
    "examples/monolith/mono-diesel-ecom",
    "examples/monolith/mono-sea-ecom",
    "examples/monolith/mono-ws-chat",
    "examples/microservices/micro-sqlx-products",
    "examples/microservices/micro-gateway",
    "examples/microservices/micro-sqlx-auth",
    "examples/microservices/micro-sqlx-carts",
    "examples/microservices/micro-sqlx-orders",
    "examples/microservices/micro-sqlx-users",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/j4flmao/ferrite_rs"

[workspace.dependencies]
# Ferrite crates
ferrite-framework = { version = "=0.1.0", path = "crates/ferrite-framework" }
fr-core = { version = "=0.1.0", path = "crates/fr-core" }
ferrite-http = { version = "=0.1.0", path = "crates/ferrite-http" }
ferrite-config = { version = "=0.1.0", path = "crates/ferrite-config" }
ferrite-validation = { version = "=0.1.0", path = "crates/ferrite-validation" }
ferrite-macros = { version = "=0.1.0", path = "crates/ferrite-macros" }
ferrite-orm = { version = "=0.1.0", path = "crates/ferrite-orm" }
ferrite-orm-sea = { version = "=0.1.0", path = "crates/ferrite-orm-sea", default-features = false }
ferrite-orm-diesel = { version = "=0.1.0", path = "crates/ferrite-orm-diesel", default-features = false }
ferrite-orm-sqlx = { version = "=0.1.0", path = "crates/ferrite-orm-sqlx", default-features = false }
ferrite-health = { version = "=0.1.0", path = "crates/ferrite-health" }
ferrite-auth-jwt = { version = "=0.1.0", path = "crates/ferrite-auth-jwt" }
ferrite-auth-oauth = { version = "=0.1.0", path = "crates/ferrite-auth-oauth" }
ferrite-swagger = { version = "=0.1.0", path = "crates/ferrite-swagger" }
ferrite-cache-redis = { version = "=0.1.0", path = "crates/ferrite-cache-redis" }
ferrite-throttler = { version = "=0.1.0", path = "crates/ferrite-throttler" }
ferrite-testing = { version = "=0.1.0", path = "crates/ferrite-testing" }
ferrite-ws = { version = "=0.1.0", path = "crates/ferrite-ws" }
ferrite-queue = { version = "=0.1.0", path = "crates/ferrite-queue" }
ferrite-cron = { version = "=0.1.0", path = "crates/ferrite-cron" }
ferrite-grpc = { version = "=0.1.0", path = "crates/ferrite-grpc" }
ferrite-nats = { version = "=0.1.0", path = "crates/ferrite-nats" }
ferrite-kafka = { version = "=0.1.0", path = "crates/ferrite-kafka" }
ferrite-i18n = { version = "=0.1.0", path = "crates/ferrite-i18n" }
ferrite-cqrs = { version = "=0.1.0", path = "crates/ferrite-cqrs" }

# Core
inventory = "0.3"
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
socket2 = "0.5"

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }

# Config
toml = "0.8"
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# Cache + rate limiter
redis = { version = "0.26", default-features = false, features = ["tokio-comp", "aio"] }
dashmap = "6"
fnv = "1"

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
url = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# OpenAPI / Swagger
utoipa = { version = "5", features = ["chrono", "uuid"] }

# Realtime + scheduling + queue
chrono = { version = "0.4", features = ["clock", "serde"] }
cron = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

# Microservices / transport
tonic = { version = "0.13", default-features = false, features = ["prost", "transport", "router", "server"] }
prost = "0.14"
prost-types = "0.14"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["net", "sync"] }

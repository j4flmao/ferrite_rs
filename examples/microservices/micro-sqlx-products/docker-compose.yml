services:
  redis:
    image: redis:7-alpine
    container_name: ferrite-micro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - micro-redis:/data

  kafka:
    image: apache/kafka:4.3.1
    container_name: ferrite-micro-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - micro-kafka:/var/lib/kafka/data

  postgres:
    image: postgres:16-alpine
    container_name: ferrite-micro-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ferrite_micro
      POSTGRES_USER: ferrite
      POSTGRES_PASSWORD: ferrite
    volumes:
      - micro-pg:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: ferrite-micro-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: ferrite_micro
      MYSQL_USER: ferrite
      MYSQL_PASSWORD: ferrite
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - micro-mysql:/var/lib/mysql

volumes:
  micro-redis:
  micro-kafka:
  micro-pg:
  micro-mysql:

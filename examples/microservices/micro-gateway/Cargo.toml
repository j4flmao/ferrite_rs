[package]
name = "micro-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ferrite-framework = { path = "../../../crates/ferrite-framework" }
ferrite-cache-redis = { path = "../../../crates/ferrite-cache-redis" }
ferrite-swagger = { path = "../../../crates/ferrite-swagger" }
ferrite-auth-jwt = { path = "../../../crates/ferrite-auth-jwt" }
ferrite-health = { path = "../../../crates/ferrite-health" }
ferrite-throttler = { path = "../../../crates/ferrite-throttler" }
ferrite-validation = { path = "../../../crates/ferrite-validation" }
ferrite-macros = { path = "../../../crates/ferrite-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
dashmap = "6"
anyhow = "1"
reqwest = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }
